<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan - KeuanganKu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/laporan.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide-icons@latest/dist/lucide.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar (Desktop) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-logo">💰 KeuanganKu</a>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
                    <li><a href="transaksi.html"><i data-lucide="receipt"></i> Transaksi</a></li>
                    <li><a href="laporan.html" class="active"><i data-lucide="bar-chart-2"></i> Laporan</a></li>
                    <li><a href="profil.html"><i data-lucide="user"></i> Profil</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="darkModeToggle" class="btn btn-icon btn-full" title="Dark Mode"><i data-lucide="moon"></i> Mode Gelap</button>
                <a href="login.html" class="btn btn-outline btn-full mt-2" id="logoutBtn"><i data-lucide="log-out"></i> Keluar</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
            <div class="page-header">
                <h1>Laporan Keuangan</h1>
                <div class="action-buttons">
                    <button class="btn btn-outline" id="printBtn">🖨️ Cetak</button>
                    <button class="btn btn-outline" id="exportPdfBtn">📄 Export PDF</button>
                    <button class="btn btn-outline" id="exportCsvBtn">📊 Export CSV</button>
                </div>
            </div>

            <!-- Loading -->
            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner"></div>
                <span>Memuat data...</span>
            </div>

            <!-- Summary -->
            <div class="summary-grid">
                <div class="card summary-card">
                    <div class="summary-info">
                        <p class="summary-label">Total Pemasukan</p>
                        <h2 class="summary-value text-green" id="totalIncome">Rp 0</h2>
                    </div>
                </div>
                <div class="card summary-card">
                    <div class="summary-info">
                        <p class="summary-label">Total Pengeluaran</p>
                        <h2 class="summary-value text-red" id="totalExpense">Rp 0</h2>
                    </div>
                </div>
                <div class="card summary-card">
                    <div class="summary-info">
                        <p class="summary-label">Saldo</p>
                        <h2 class="summary-value" id="totalBalance">Rp 0</h2>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="charts-grid">
                <div class="card chart-card">
                    <h3>Pengeluaran per Kategori</h3>
                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
                <div class="card chart-card">
                    <h3>Pemasukan & Pengeluaran per Bulan</h3>
                    <div class="chart-container">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation (Mobile) -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="bottom-nav-item">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>
            <a href="transaksi.html" class="bottom-nav-item">
                <i data-lucide="receipt"></i>
                <span>Transaksi</span>
            </a>
            <a href="#" class="bottom-nav-item add-button" id="addTransactionBtnMobile">
                <i data-lucide="plus"></i>
            </a>
            <a href="laporan.html" class="bottom-nav-item active">
                <i data-lucide="bar-chart-2"></i>
                <span>Laporan</span>
            </a>
            <a href="profil.html" class="bottom-nav-item">
                <i data-lucide="user"></i>
                <span>Profil</span>
            </a>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/laporan.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
