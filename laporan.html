<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan - KeuanganKu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/laporan.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container navbar-content">
            <a href="dashboard.html" class="navbar-brand">💰 KeuanganKu</a>
            <div class="navbar-menu" id="navbarMenu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="transaksi.html" class="nav-link">Transaksi</a>
                <a href="laporan.html" class="nav-link active">Laporan</a>
                <a href="profil.html" class="nav-link">Profil</a>
                <button id="darkModeToggle" class="btn btn-icon" title="Dark Mode">🌙</button>
                <a href="login.html" class="btn btn-outline" id="logoutBtn">Keluar</a>
            </div>
            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Laporan Content -->
    <main class="laporan-page">
        <div class="container">
            <div class="page-header">
                <h1>Laporan Keuangan</h1>
                <div class="action-buttons">
                    <button class="btn btn-outline" id="printBtn">🖨️ Cetak</button>
                    <button class="btn btn-outline" id="exportPdfBtn">📄 Export PDF</button>
                    <button class="btn btn-outline" id="exportCsvBtn">📊 Export CSV</button>
                </div>
            </div>

            <!-- Loading -->
            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner"></div>
                <span>Memuat data...</span>
            </div>

            <!-- Summary -->
            <div class="summary-grid">
                <div class="card summary-card">
                    <div class="summary-info">
                        <p class="summary-label">Total Pemasukan</p>
                        <h2 class="summary-value text-green" id="totalIncome">Rp 0</h2>
                    </div>
                </div>
                <div class="card summary-card">
                    <div class="summary-info">
                        <p class="summary-label">Total Pengeluaran</p>
                        <h2 class="summary-value text-red" id="totalExpense">Rp 0</h2>
                    </div>
                </div>
                <div class="card summary-card">
                    <div class="summary-info">
                        <p class="summary-label">Saldo</p>
                        <h2 class="summary-value" id="totalBalance">Rp 0</h2>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="charts-grid">
                <div class="card chart-card">
                    <h3>Pengeluaran per Kategori</h3>
                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
                <div class="card chart-card">
                    <h3>Pemasukan & Pengeluaran per Bulan</h3>
                    <div class="chart-container">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/laporan.js"></script>
</body>
</html>
